{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="mb-6">
  <p class="mono muted" style="font-size:0.82rem; margin:0 0 4px;">Your student profile</p>
  <h1 style="font-size:clamp(2rem,5vw,2.8rem); font-weight:700; line-height:1.1;">Profile</h1>
</div>

<div class="card mb-6">
  <div class="flex flex-wrap items-center gap-4">
    <div class="icon-box" style="margin-bottom:0;"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    <div>
      <div class="title" style="font-size:1.2rem;">{{ user.name or 'Student' }}</div>
      <div class="sub">Current streak: {{ user.streak }} day{% if user.streak != 1 %}s{% endif %}</div>
    </div>
  </div>
</div>

<div class="stats-grid">
  <div class="card stat-card">
    <div class="icon-box"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg></div>
    <div class="lbl">Streak</div>
    <div class="num">{{ user.streak }}</div>
  </div>
  <div class="card stat-card">
    <div class="icon-box"><svg width="22" height="22" fill="none" stroke="var(--teal)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div>
    <div class="lbl">Focus</div>
    <div class="num">Healthy</div>
  </div>
</div>
{% endblock %}
