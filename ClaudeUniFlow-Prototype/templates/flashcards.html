{% extends "base.html" %}
{% block title %}Flashcards{% endblock %}

{% block content %}
<div class="mb-6">
  <p class="mono muted" style="font-size:0.82rem; margin:0 0 4px;">Revision mode</p>
  <h1 style="font-size:clamp(2rem,5vw,2.8rem); font-weight:700; line-height:1.1;">Flashcards</h1>
</div>

<div class="card mb-6">
  <div class="flashcard-stage">
    <div class="flashcard" id="flashcard">
      <div class="flashcard-label">Prompt</div>
      <div class="flashcard-text" id="flashcardText">{{ flashcards[0].front }}</div>
      <button class="btn btn-outline mt-6" id="flipBtn" onclick="flipCard()">Reveal answer</button>
    </div>
    <div class="flashcard-actions">
      <button class="btn btn-amber" onclick="prevCard()">Previous</button>
      <button class="btn btn-teal" onclick="nextCard()">Next</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const cards = {{ flashcards | tojson }};
  let index = 0;
  let showingAnswer = false;

  function renderCard() {
    const card = cards[index];
    const flashcard = document.getElementById('flashcard');
    const text = document.getElementById('flashcardText');
    const btn = document.getElementById('flipBtn');
    text.textContent = showingAnswer ? card.back : card.front;
    flashcard.classList.toggle('is-flipped', showingAnswer);
    btn.textContent = showingAnswer ? 'Hide answer' : 'Reveal answer';
  }

  function flipCard() {
    showingAnswer = !showingAnswer;
    renderCard();
  }

  function nextCard() {
    index = (index + 1) % cards.length;
    showingAnswer = false;
    renderCard();
  }

  function prevCard() {
    index = (index - 1 + cards.length) % cards.length;
    showingAnswer = false;
    renderCard();
  }

  renderCard();
</script>
{% endblock %}
