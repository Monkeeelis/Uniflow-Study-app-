{% extends "base.html" %}
{% block title %}Welcome{% endblock %}

{% block content %}
<div class="card" style="max-width:720px; margin:0 auto;">
  <div class="mb-6">
    <p class="mono muted" style="font-size:0.82rem; margin:0 0 4px;">Let’s get you set up</p>
    <h1 style="font-size:clamp(2rem,5vw,2.8rem); font-weight:700; line-height:1.1;">Welcome to UniFlow</h1>
  </div>

  <form method="post" class="card-inner">
    <label for="name" class="mono muted" style="display:block; margin-bottom:8px; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em;">Your name</label>
    <input id="name" name="name" type="text" placeholder="Enter your name" class="w-full" style="padding:14px 16px; border:2px solid var(--cream-border); border-radius:14px; background:var(--white); font-size:1rem; color:var(--brown);" required>
    <div class="mt-6">
      <button class="btn btn-amber" type="submit">Continue to dashboard</button>
    </div>
  </form>
</div>
{% endblock %}
