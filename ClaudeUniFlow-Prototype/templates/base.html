<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniFlow | {% block title %}Dashboard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

<!-- ── Navigation ─────────────────────────────────────────────────────────── -->
<nav class="nav">
  <div class="nav-inner">

    <!-- Brand -->
    <a href="/dashboard" class="nav-brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 7v14"/>
        <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
      </svg>
      UniFlow
    </a>

    <!-- Links -->
    <div class="nav-links">
      <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="2" y="2" rx="1"/><rect width="7" height="5" x="13" y="2" rx="1"/><rect width="7" height="9" x="13" y="11" rx="1"/><rect width="7" height="5" x="2" y="15" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/tasks" class="nav-link {% if request.path == '/tasks' %}active{% endif %}">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg>
        <span>Tasks</span>
      </a>
      <a href="/calendar" class="nav-link {% if request.path == '/calendar' %}active{% endif %}">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <span>Calendar</span>
      </a>
      <a href="/focus" class="nav-link {% if request.path == '/focus' %}active{% endif %}">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
        <span>Focus</span>
      </a>
      <a href="/flashcards" class="nav-link {% if request.path == '/flashcards' %}active{% endif %}">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
        <span>Cards</span>
      </a>
      <a href="/profile" class="nav-link {% if request.path == '/profile' %}active{% endif %}">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
    </div>

    <!-- Bell -->
    <button class="nav-bell" title="Notifications">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
    </button>

  </div>
</nav>

<!-- ── Page content ────────────────────────────────────────────────────────── -->
<main class="page">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
