{% extends "base.html" %}
{% block title %}Focus{% endblock %}

{% block content %}
<div class="mb-6">
  <p class="mono muted" style="font-size:0.82rem; margin:0 0 4px;">Deep work mode</p>
  <h1 style="font-size:clamp(2rem,5vw,2.8rem); font-weight:700; line-height:1.1;">Focus</h1>
</div>

<div class="card mb-6">
  <div class="pomodoro-card">
    <div class="pomodoro-ring">
      <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
      <div class="pomodoro-mode" id="pomodoroMode">Focus</div>
    </div>
    <div class="timer-btns mt-6">
      <button class="btn btn-amber" id="startPomodoro" onclick="togglePomodoro()">Start</button>
      <button class="btn btn-outline" id="pausePomodoro" onclick="resetPomodoro()">Reset</button>
    </div>
  </div>
</div>

<div class="stats-grid">
  <div class="card stat-card">
    <div class="icon-box"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg></div>
    <div class="lbl">Focus sessions</div>
    <div class="num">6</div>
  </div>
  <div class="card stat-card">
    <div class="icon-box"><svg width="22" height="22" fill="none" stroke="var(--teal)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div>
    <div class="lbl">Completed</div>
    <div class="num">4</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const workDuration = 25 * 60;
  const breakDuration = 5 * 60;
  let secondsLeft = workDuration;
  let timerId = null;
  let isRunning = false;
  let isBreak = false;

  function formatTime(totalSeconds) {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  }

  function updateTimer() {
    document.getElementById('pomodoroTimer').textContent = formatTime(secondsLeft);
    document.getElementById('pomodoroMode').textContent = isBreak ? 'Break' : 'Focus';
  }

  function tick() {
    if (secondsLeft > 0) {
      secondsLeft -= 1;
      updateTimer();
      return;
    }

    clearInterval(timerId);
    isRunning = false;
    isBreak = !isBreak;
    secondsLeft = isBreak ? breakDuration : workDuration;
    updateTimer();
  }

  function togglePomodoro() {
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      document.getElementById('startPomodoro').textContent = 'Resume';
      return;
    }

    isRunning = true;
    document.getElementById('startPomodoro').textContent = 'Pause';
    timerId = setInterval(tick, 1000);
  }

  function resetPomodoro() {
    clearInterval(timerId);
    isRunning = false;
    isBreak = false;
    secondsLeft = workDuration;
    document.getElementById('startPomodoro').textContent = 'Start';
    updateTimer();
  }

  updateTimer();
</script>
{% endblock %}
