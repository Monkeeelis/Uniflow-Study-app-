{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <div class="mb-6 text-center">
      <p class="mono muted" style="font-size:0.82rem; margin:0 0 6px;">Welcome to UniFlow</p>
      <h1 style="font-size:clamp(2rem,5vw,2.8rem); font-weight:700; line-height:1.1;">Student login</h1>
    </div>

    {% if error %}
      <div class="alert-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="auth-form">
      <label for="name" class="field-label">Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required>

      <label for="grade" class="field-label">Grade</label>
      <input id="grade" name="grade" type="text" placeholder="e.g. Year 12" required>

      <button class="btn btn-amber w-full" type="submit">Continue</button>
    </form>
  </div>
</div>
{% endblock %}
