{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh] py-12">
    <div class="paper-card w-full max-w-md rounded-2xl p-8 border border-outline-variant bg-background text-center relative overflow-hidden">
        <div class="absolute inset-0 z-0 overflow-hidden opacity-5 pointer-events-none">
            <div class="w-full h-full" style="background-image: radial-gradient(#5A3E22 1px, transparent 1px); background-size: 20px 20px;"></div>
        </div>

        <div class="relative z-10">
            <div class="w-16 h-16 rounded-full bg-secondary-container/20 border-2 border-terracotta-accent flex items-center justify-center mx-auto mb-6">
                <span class="material-symbols-outlined text-3xl text-terracotta-accent">school</span>
            </div>
            
            <h1 class="font-headline-lg text-headline-lg text-ink-deep mb-2">Welcome to UniFlow</h1>
            <p class="text-xs text-on-surface-variant mb-6 uppercase tracking-wider font-semibold">Your Academic Companion</p>

            <form action="/login" method="POST" class="space-y-6">
                <div class="text-left">
                    <label class="block text-xs font-label-caps text-on-surface-variant mb-2" for="name">Who is studying today?</label>
                    <input type="text" id="name" name="name" required autofocus
                           class="w-full rounded-xl border-outline-variant bg-paper-base text-ink-deep font-bold px-4 py-3 focus:ring-terracotta-accent focus:border-terracotta-accent placeholder-on-surface-variant/40"
                           placeholder="Enter your name to start...">
                </div>

                <button type="submit" class="w-full bg-ink-deep text-paper-base py-3 rounded-xl font-label-caps text-label-caps font-bold hover:bg-opacity-95 transition-all select-none">
                    START SESSION
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
