{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] py-8">
    <div class="paper-card w-full max-w-lg rounded-2xl p-8 border border-outline-variant bg-background relative overflow-hidden">
        <div class="absolute inset-0 z-0 overflow-hidden opacity-5 pointer-events-none">
            <div class="w-full h-full" style="background-image: radial-gradient(#5A3E22 1px, transparent 1px); background-size: 20px 20px;"></div>
        </div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <span class="material-symbols-outlined text-4xl text-terracotta-accent animate-pulse">settings_accessibility</span>
                <h1 class="font-headline-lg text-headline-lg text-ink-deep mt-2">Academic Setup</h1>
                <p class="text-xs text-on-surface-variant mt-1 uppercase tracking-wider font-semibold">Customize your UniFlow workspace</p>
            </div>

            <form action="/onboarding" method="POST" class="space-y-6">
                <div>
                    <label class="block text-xs font-label-caps text-on-surface-variant mb-2" for="year_level">Year Level</label>
                    <select id="year_level" name="year_level" required
                            class="w-full rounded-xl border-outline-variant bg-paper-base text-ink-deep px-4 py-3 focus:ring-terracotta-accent focus:border-terracotta-accent">
                        <option value="High School">High School</option>
                        <option value="College Freshman">College Freshman</option>
                        <option value="College Sophomore">College Sophomore</option>
                        <option value="College Junior">College Junior</option>
                        <option value="College Senior">College Senior</option>
                        <option value="Postgraduate">Postgraduate</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-label-caps text-on-surface-variant mb-2" for="subjects">Subjects you are studying (comma-separated)</label>
                    <input type="text" id="subjects" name="subjects" required
                           class="w-full rounded-xl border-outline-variant bg-paper-base text-ink-deep px-4 py-3 focus:ring-terracotta-accent focus:border-terracotta-accent placeholder-on-surface-variant/40"
                           placeholder="e.g. Cognitive Psychology, AI Ethics, Computer Science">
                    <p class="text-[10px] text-on-surface-variant/80 mt-1.5 italic">This automatically creates study topics, flashcard decks, and AI channels for your subjects!</p>
                </div>

                <button type="submit" class="w-full bg-ink-deep text-paper-base py-3 rounded-xl font-label-caps text-label-caps font-bold hover:bg-opacity-95 transition-all select-none">
                    COMPLETE SETUP & ENTER
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
